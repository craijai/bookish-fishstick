<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Roboto', sans-serif; margin:0; background:#f0f4f8; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; }
.hidden { display:none; }
.card { background:white; border-radius:15px; padding:20px; margin:10px; width:550px; box-shadow:0 8px 20px rgba(0,0,0,0.2);}
input, select { width:100%; padding:8px; margin:5px 0; border-radius:5px; border:1px solid #ccc; outline:none; }
button { padding:5px 10px; border:none; border-radius:8px; cursor:pointer; margin:3px; }
.btn-primary { background:#ff6f61; color:white; }
.btn-secondary { background:#6ab04c; color:white; }
.btn-danger { background:#f44336; color:white; }

/* CHAT STYLES */
#chat-container { display:flex; flex-direction:column; height:750px; width:550px; }
#group-list { background:#fff5e6; padding:10px; height:150px; overflow-y:auto; border-radius:10px; }
#chat-box { background:#e6f7ff; flex:1; padding:10px; overflow-y:auto; border-radius:10px; margin:10px 0; position:relative;}
#chat-box p { margin:5px 0; padding:10px; border-radius:12px; max-width:75%; position:relative; word-wrap:break-word; }
#chat-box p.self { background:#ffe6f0; margin-left:auto; }
#chat-box p.other { background:#d9f7be; margin-right:auto; }
#chat-box img { max-width:150px; display:block; margin-top:5px; border-radius:8px; }
#message-area { display:flex; gap:5px; margin-top:5px; }
#message-input { flex:1; padding:8px; border-radius:8px; border:1px solid #ccc; }
.reactions { display:flex; gap:5px; position:absolute; bottom:-20px; right:5px; }
.emoji-btn { cursor:pointer; }
.poll { background:#fff0f5; padding:8px; border-radius:10px; margin:5px 0; }
.avatar { width:30px; height:30px; border-radius:50%; vertical-align:middle; margin-right:5px; }
.online-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:3px; background:green; }
.typing-indicator { font-style:italic; color:#555; font-size:0.9em; margin:3px 0; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-container" class="card">
<h2>ChatterBox</h2>
<input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<label>Avatar: <input type="file" id="avatar-upload" accept="image/*"></label>
<button id="register-btn" class="btn-primary">Register</button>
<button id="login-btn" class="btn-secondary">Login</button>
</div>

<!-- CHAT -->
<div id="chat-container" class="hidden card">
<div id="group-list" class="card">
<h3>Groups</h3>
<div id="groups"></div>
<input type="text" id="new-group-name" placeholder="New group name">
<button id="create-group-btn" class="btn-primary">Create Group</button>
</div>

<div id="chat-box"></div>
<div id="typing-indicators" class="typing-indicator"></div>

<div id="message-area">
<input type="text" id="message-input" placeholder="Type a message...">
<button id="emoji-btn" class="btn-secondary">😀</button>
<input type="file" id="message-file">
<button id="send-btn" class="btn-primary">Send</button>
</div>

<div>
<button id="create-poll-btn" class="btn-secondary">Create Poll</button>
<button id="logout-btn" class="btn-danger">Logout</button>
</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<script>
// ---------- FIREBASE CONFIG ----------
const firebaseConfig = {
  apiKey: "AIzaSyBJE5z3a6-_2gxonPCmXLgMhlctBkt-wiE",
  authDomain: "jbchat-1fe10.firebaseapp.com",
  projectId: "jbchat-1fe10",
  storageBucket: "jbchat-1fe10.firebasestorage.app",
  messagingSenderId: "217576491356",
  appId: "1:217576491356:web:d736d11730e83f24ee9999",
  measurementId: "G-TM94MLYNGT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// ---------- DOM ----------
const authContainer = document.getElementById("auth-container");
const chatContainer = document.getElementById("chat-container");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const avatarUpload = document.getElementById("avatar-upload");
const registerBtn = document.getElementById("register-btn");
const loginBtn = document.getElementById("login-btn");
const logoutBtn = document.getElementById("logout-btn");
const groupsDiv = document.getElementById("groups");
const newGroupInput = document.getElementById("new-group-name");
const createGroupBtn = document.getElementById("create-group-btn");
const chatBox = document.getElementById("chat-box");
const messageInput = document.getElementById("message-input");
const messageFile = document.getElementById("message-file");
const sendBtn = document.getElementById("send-btn");
const emojiBtn = document.getElementById("emoji-btn");
const createPollBtn = document.getElementById("create-poll-btn");
const typingDiv = document.getElementById("typing-indicators");

let currentUser;
let currentGroupId = null;
let typingTimeout;

// ---------- AUTH ----------
registerBtn.onclick = async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  const username = usernameInput.value.trim();
  const avatarFile = avatarUpload.files[0];
  if(!email||!password||!username) return alert("Fill all fields");
  let avatarUrl="";
  if(avatarFile){
    const ref=storage.ref("avatars/"+Date.now()+"_"+avatarFile.name);
    await ref.put(avatarFile);
    avatarUrl=await ref.getDownloadURL();
  }
  auth.createUserWithEmailAndPassword(email,password).then(async cred=>{
    await db.collection("users").doc(cred.user.uid).set({username,avatarUrl,online:true,lastSeen:Date.now()});
  }).catch(err=>alert(err.message));
};

loginBtn.onclick=()=>{ 
  const email=emailInput.value.trim(); 
  const password=passwordInput.value.trim(); 
  auth.signInWithEmailAndPassword(email,password).catch(err=>alert(err.message)); 
};

auth.onAuthStateChanged(async user=>{
  if(user){ 
    currentUser=user; 
    authContainer.classList.add("hidden"); 
    chatContainer.classList.remove("hidden"); 
    await db.collection("users").doc(user.uid).update({online:true}); 
    loadGroups(); 
    window.addEventListener("beforeunload",()=>{ db.collection("users").doc(user.uid).update({online:false,lastSeen:Date.now()}); });
  } else { 
    currentUser=null; 
    authContainer.classList.remove("hidden"); 
    chatContainer.classList.add("hidden"); 
    chatBox.innerHTML=""; groupsDiv.innerHTML=""; 
  }
});

// ---------- GROUPS ----------
createGroupBtn.onclick=async()=>{ const name=newGroupInput.value.trim(); if(!name) return; await db.collection("groups").add({name,members:[currentUser.uid]}); newGroupInput.value=""; loadGroups(); };
function loadGroups(){ db.collection("groups").onSnapshot(snap=>{ groupsDiv.innerHTML=""; snap.forEach(doc=>{ const data=doc.data(); const div=document.createElement("div"); div.textContent=data.name; div.style.cursor="pointer"; div.onclick=()=>{ selectGroup(doc.id,data.name); }; groupsDiv.appendChild(div); }); }); }

function selectGroup(groupId,groupName){ currentGroupId=groupId; chatBox.innerHTML=""; loadMessages(); loadPolls(); loadTypingIndicators(); }

// ---------- MESSAGES ----------
sendBtn.onclick=async()=>{
  if(!currentGroupId) return alert("Select a group");
  const text=messageInput.value.trim();
  if(!text && !messageFile.files[0]) return;
  let fileUrl="";
  if(messageFile.files[0]){ const file=messageFile.files[0]; const ref=storage.ref("messages/"+Date.now()+"_"+file.name); await ref.put(file); fileUrl=await ref.getDownloadURL(); }
  const userDoc=await db.collection("users").doc(currentUser.uid).get();
  db.collection("messages").doc(currentGroupId).collection("msgs").add({ senderId:currentUser.uid, username:userDoc.data().username, avatarUrl:userDoc.data().avatarUrl, text, fileUrl, timestamp:Date.now() });
  messageInput.value=""; messageFile.value="";
  stopTyping();
};

// ---------- TYPING INDICATORS ----------
messageInput.addEventListener("input",()=>{
  if(!currentGroupId || !currentUser) return;
  db.collection("typing").doc(currentGroupId).collection("users").doc(currentUser.uid).set({isTyping:true,timestamp:Date.now()});
  clearTimeout(typingTimeout);
  typingTimeout=setTimeout(stopTyping,2000);
});

function stopTyping(){
  if(!currentGroupId || !currentUser) return;
  db.collection("typing").doc(currentGroupId).collection("users").doc(currentUser.uid).set({isTyping:false,timestamp:Date.now()});
}

function loadTypingIndicators(){
  if(!currentGroupId) return;
  db.collection("typing").doc(currentGroupId).collection("users").onSnapshot(snapshot=>{
    let names=[];
    snapshot.forEach(doc=>{
      const data=doc.data();
      if(data.isTyping && doc.id!==currentUser.uid) names.push(doc.id); 
    });
    typingDiv.textContent=names.length>0?`Someone is typing...`:"";
  });
}

// ---------- EMOJIS ----------
emojiBtn.onclick=()=>{ messageInput.value+= "😀"; };

// ---------- POLLS ----------
createPollBtn.onclick=()=>{
  if(!currentGroupId) return alert("Select group");
  const question=prompt("Enter poll question:");
  const options=prompt("Enter options separated by comma:").split(",");
  if(!question||options.length<2) return alert("Need question and 2+ options");
  db.collection("polls").doc(currentGroupId).collection("pollList").add({question,options,votes:{}});
  loadPolls();
};

function loadPolls(){
  db.collection("polls").doc(currentGroupId).collection("pollList")
    .onSnapshot(snap=>{ snap.forEach(doc=>{
      const poll=doc.data();
      const div=document.createElement("div"); div.classList.add("poll");
      div.innerHTML=`<b>${poll.question}</b>`;
      poll.options.forEach((opt,i)=>{
        const btn=document.createElement("button");
        btn.textContent=opt;
        btn.onclick=()=>votePoll(doc.id,i);
        div.appendChild(btn);
      });
      chatBox.appendChild(div);
      chatBox.scrollTop=chatBox.scrollHeight;
    }); });
}

async function votePoll(pollId,optIndex){
  const pollRef=db.collection("polls").doc(currentGroupId).collection("pollList").doc(pollId);
  const pollDoc=await pollRef.get();
  const votes=pollDoc.data().votes||{};
  votes[currentUser.uid]=optIndex;
  await pollRef.update({votes});
}

// ---------- REACTIONS ----------
function addReactions(p,messageId){
  const div=document.createElement("div"); div.classList.add("reactions");
  ["😀","❤️","👍"].forEach(async emoji=>{
    const span=document.createElement("span"); span.textContent=emoji; span.classList.add("emoji-btn");
    span.onclick=async()=>{ const ref=db.collection("reactions").doc(currentGroupId).collection("msgReactions").doc(messageId); const doc=await ref.get(); const data=doc.exists?doc.data():{}; data[emoji]=data[emoji]?data[emoji]+1:1; await ref.set(data); };
    div.appendChild(span);
  });
  p.appendChild(div);
}

// ---------- LOGOUT ----------
logoutBtn.onclick=()=>{
  if(currentUser) db.collection("users").doc(currentUser.uid).update({online:false,lastSeen:Date.now()});
  auth.signOut();
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatLand</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      width: 400px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.3);
    }
    .hidden { display: none; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input:focus { border-color: #2575fc; outline: none; }
    .btn-group { display: flex; justify-content: space-between; }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: #2575fc; color: white; }
    .btn-logout { background: #ff4d4d; color: white; }
    #chat-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    #chat-box {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    #chat-box p {
      background: #e0e0e0;
      padding: 8px 12px;
      border-radius: 10px;
      margin: 6px 0;
    }
    #chat-box p.self {
      background: #2575fc;
      color: white;
      text-align: right;
    }
    #message-area { display: flex; gap: 10px; }
    #message-input { flex: 1; }
  </style>
</head>
<body>

<!-- AUTH FORM -->
<div id="auth-container" class="card">
  <h2>💬 ChatLand</h2>
  <p>Create an account or login</p>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <div class="btn-group">
    <button id="login-btn" class="btn">Login</button>
    <button id="register-btn" class="btn btn-primary">Register</button>
  </div>
</div>

<!-- CHAT INTERFACE -->
<div id="chat-container" class="card hidden">
  <div id="chat-header">
    <span id="user-info"></span>
    <button id="logout-btn" class="btn btn-logout">Logout</button>
  </div>
  <div id="chat-box"></div>
  <div id="message-area">
    <input type="text" id="message-input" placeholder="Type a message...">
    <button id="send-btn" class="btn btn-primary">Send</button>
  </div>
</div>

<!-- FIREBASE SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // ------------------- FIREBASE CONFIG -------------------
  const firebaseConfig = {
    apiKey: "AIzaSyAYlxQplECLz6gkrYF6cjQmXjGcmuJh1sk",
    authDomain: "harak-chat.firebaseapp.com",
    databaseURL: "https://harak-chat-default-rtdb.firebaseio.com",
    projectId: "harak-chat",
    storageBucket: "harak-chat.appspot.com",
    messagingSenderId: "716682667532",
    appId: "1:716682667532:web:7a272b4b44a671eb65b029"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const database = firebase.database();

  // ------------------- DOM ELEMENTS -------------------
  const authContainer = document.getElementById("auth-container");
  const chatContainer = document.getElementById("chat-container");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("login-btn");
  const registerBtn = document.getElementById("register-btn");
  const logoutBtn = document.getElementById("logout-btn");
  const chatBox = document.getElementById("chat-box");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const userInfo = document.getElementById("user-info");

  let currentUser;

  // ------------------- AUTH STATE -------------------
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      authContainer.classList.add("hidden");
      chatContainer.classList.remove("hidden");
      userInfo.textContent = user.email.split("@")[0];
      loadMessages();
    } else {
      authContainer.classList.remove("hidden");
      chatContainer.classList.add("hidden");
      chatBox.innerHTML = "";
    }
  });

  // ------------------- REGISTER -------------------
  registerBtn.onclick = () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    if (!email || !password) return alert("Enter email & password");

    auth.createUserWithEmailAndPassword(email, password)
      .then(() => { emailInput.value = ""; passwordInput.value = ""; })
      .catch(err => alert(err.message));
  };

  // ------------------- LOGIN -------------------
  loginBtn.onclick = () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    if (!email || !password) return alert("Enter email & password");

    auth.signInWithEmailAndPassword(email, password)
      .catch(err => {
        if (err.code === "auth/user-not-found") {
          alert("Account not found. Please register first.");
        } else {
          alert(err.message);
        }
      });
  };

  // ------------------- LOGOUT -------------------
  logoutBtn.onclick = () => auth.signOut();

  // ------------------- SEND MESSAGE -------------------
  sendBtn.onclick = sendMessage;
  messageInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentUser) return;

    database.ref("messages").push({
      uid: currentUser.uid,
      username: currentUser.email.split("@")[0],
      text,
      timestamp: Date.now()
    });
    messageInput.value = "";
  }

  // ------------------- LOAD MESSAGES -------------------
  function loadMessages() {
    database.ref("messages").off();
    database.ref("messages").on("child_added", snapshot => {
      const msg = snapshot.val();
      const p = document.createElement("p");
      p.textContent = `${msg.username}: ${msg.text}`;
      if (msg.uid === currentUser.uid) p.classList.add("self");
      chatBox.appendChild(p);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatterBox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#eef2f7;
  display:flex;
  justify-content:center;
}

.hidden { display:none; }

.app {
  width:900px;
  height:95vh;
  display:flex;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar {
  width:250px;
  background:#f7f9fc;
  padding:10px;
  overflow-y:auto;
}
.sidebar h3 { margin:10px 0 5px; }

.item {
  padding:8px;
  margin:3px 0;
  border-radius:6px;
  cursor:pointer;
}
.item:hover { background:#dde6ff; }
.active { background:#b8c9ff; }

/* CHAT */
.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#chat-box {
  flex:1;
  padding:10px;
  overflow-y:auto;
  background:#f0f4ff;
}

.msg {
  max-width:70%;
  margin:5px 0;
  padding:8px;
  border-radius:10px;
}
.self { background:#ffd6e8; margin-left:auto; }
.other { background:#d7ffd9; }

#message-area {
  display:flex;
  gap:8px;
  padding:10px;
}
textarea {
  flex:1;
  resize:none;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}
button {
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}
.send { background:#4f6cff; color:white; }

/* AUTH */
#auth {
  width:400px;
  margin-top:40px;
}
input {
  width:100%;
  padding:8px;
  margin:5px 0;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <h2>ChatterBox</h2>
  <input id="username" placeholder="Username">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="register">Register</button>
  <button id="login">Login</button>
</div>

<!-- APP -->
<div class="app hidden" id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Groups</h3>
    <div id="groups"></div>
    <input id="newGroup" placeholder="New group">
    <button id="createGroup">Create</button>

    <h3>DMs</h3>
    <div id="dms"></div>

    <button id="logout">Logout</button>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <div id="chat-box"></div>

    <div id="message-area">
      <textarea id="message" rows="2" placeholder="Type..."></textarea>
      <button class="send" id="send">Send</button>
    </div>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
/* 🔥 CONFIG */
firebase.initializeApp({
  apiKey: "AIzaSyBJE5z3a6-_2gxonPCmXLgMhlctBkt-wiE",
  authDomain: "jbchat-1fe10.firebaseapp.com",
  projectId: "jbchat-1fe10"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* STATE */
let currentUser;
let currentChatId;
let chatType; // "group" or "dm"

/* AUTH */
register.onclick = async () => {
  const u = username.value, e = email.value, p = password.value;
  const cred = await auth.createUserWithEmailAndPassword(e,p);
  await db.collection("users").doc(cred.user.uid).set({username:u});
};

login.onclick = () => auth.signInWithEmailAndPassword(email.value,password.value);

auth.onAuthStateChanged(u=>{
  if(u){
    currentUser=u;
    auth.style.display="none";
    app.classList.remove("hidden");
    loadGroups();
    loadDMs();
  }
});

/* GROUPS */
createGroup.onclick = async ()=>{
  if(!newGroup.value) return;
  await db.collection("groups").add({
    name:newGroup.value,
    members:[currentUser.uid]
  });
  newGroup.value="";
};

function loadGroups(){
  db.collection("groups").onSnapshot(snap=>{
    groups.innerHTML="";
    snap.forEach(d=>{
      const div=document.createElement("div");
      div.textContent=d.data().name;
      div.className="item";
      div.onclick=()=>openGroup(d.id);
      groups.appendChild(div);
    });
  });
}

async function openGroup(id){
  chatType="group";
  currentChatId=id;

  // 🔥 AUTO JOIN
  const ref=db.collection("groups").doc(id);
  await ref.update({
    members: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  });

  loadMessages();
}

/* DMS */
function loadDMs(){
  db.collection("users").onSnapshot(snap=>{
    dms.innerHTML="";
    snap.forEach(d=>{
      if(d.id===currentUser.uid) return;
      const div=document.createElement("div");
      div.textContent=d.data().username;
      div.className="item";
      div.onclick=()=>openDM(d.id);
      dms.appendChild(div);
    });
  });
}

async function openDM(other){
  chatType="dm";

  const q=await db.collection("dms")
    .where("users","array-contains",currentUser.uid).get();

  let id=null;
  q.forEach(d=>{
    if(d.data().users.includes(other)) id=d.id;
  });

  if(!id){
    const ref=await db.collection("dms").add({
      users:[currentUser.uid,other]
    });
    id=ref.id;
  }

  currentChatId=id;
  loadMessages();
}

/* MESSAGES */
send.onclick = async ()=>{
  if(!message.value) return;

  const userDoc = await db.collection("users").doc(currentUser.uid).get();
  const ref = chatType==="group"
    ? db.collection("messages").doc(currentChatId).collection("msgs")
    : db.collection("dms").doc(currentChatId).collection("msgs");

  await ref.add({
    sender: currentUser.uid,
    username: userDoc.data().username,
    text: message.value,
    time: Date.now()
  });

  message.value="";
};

function loadMessages(){
  chat-box.innerHTML="";
  const ref = chatType==="group"
    ? db.collection("messages").doc(currentChatId).collection("msgs")
    : db.collection("dms").doc(currentChatId).collection("msgs");

  ref.orderBy("time").onSnapshot(snap=>{
    chat-box.innerHTML="";
    snap.forEach(d=>{
      const m=document.createElement("div");
      m.className="msg "+(d.data().sender===currentUser.uid?"self":"other");
      m.textContent=d.data().username+": "+d.data().text;
      chat-box.appendChild(m);
    });
    chat-box.scrollTop=chat-box.scrollHeight;
  });
}

logout.onclick=()=>auth.signOut();
</script>
</body>
</html>

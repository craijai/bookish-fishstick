<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Roboto', sans-serif; margin:0; background:#f0f4f8; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; }
.hidden { display:none; }

/* CARD */
.card { background:white; border-radius:15px; padding:20px; margin:10px; width:550px; box-shadow:0 8px 20px rgba(0,0,0,0.2); }

/* INPUTS & BUTTONS */
input, textarea, select { width:100%; padding:8px; margin:5px 0; border-radius:8px; border:1px solid #ccc; outline:none; font-size:16px; }
textarea { resize: vertical; min-height:50px; }
button { padding:8px 12px; border:none; border-radius:12px; cursor:pointer; margin:3px; font-size:15px; }
.btn-primary { background:#ff6f61; color:white; }
.btn-secondary { background:#6ab04c; color:white; }
.btn-danger { background:#f44336; color:white; }

/* CHAT CONTAINER */
#chat-container { display:flex; flex-direction:column; height:750px; width:550px; }
#group-list { background:#fff5e6; padding:10px; height:150px; overflow-y:auto; border-radius:10px; }
.group-item { cursor:pointer; padding:5px; border-radius:6px; margin:3px 0; }
.group-item:hover { background:#ffe6c2; }
.group-item.active { background:#ffb580; }

#chat-box { background:#e6f7ff; flex:1; padding:10px; overflow-y:auto; border-radius:10px; margin:10px 0; position:relative;}
#chat-box p { margin:5px 0; padding:10px; border-radius:12px; max-width:75%; word-wrap:break-word; position:relative; }
#chat-box p.self { background:#ffe6f0; margin-left:auto; }
#chat-box p.other { background:#d9f7be; margin-right:auto; }
#chat-box img { max-width:150px; display:block; margin-top:5px; border-radius:8px; }

/* MESSAGE AREA */
#message-area { display:flex; gap:10px; align-items:flex-end; }
#message-input { flex:1; padding:10px; border-radius:12px; border:1px solid #ccc; font-size:16px; min-height:50px; }
#message-buttons { display:flex; gap:5px; flex-shrink:0; }

/* AVATARS & STATUS */
.avatar { width:30px; height:30px; border-radius:50%; vertical-align:middle; margin-right:5px; }
.online-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:3px; background:green; }
.typing-indicator { font-style:italic; color:#555; font-size:0.9em; margin:3px 0; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-container" class="card">
<h2>ChatterBox</h2>
<input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<label>Avatar: <input type="file" id="avatar-upload" accept="image/*"></label>
<button id="register-btn" class="btn-primary">Register</button>
<button id="login-btn" class="btn-secondary">Login</button>
</div>

<!-- CHAT -->
<div id="chat-container" class="hidden card">
<div id="group-list" class="card">
<h3>Groups</h3>
<div id="groups"></div>
<input type="text" id="new-group-name" placeholder="New group name">
<button id="create-group-btn" class="btn-primary">Create Group</button>
</div>

<div id="chat-box"></div>
<div id="typing-indicators" class="typing-indicator"></div>

<!-- MESSAGE AREA -->
<div id="message-area">
<textarea id="message-input" placeholder="Type a message..."></textarea>
<div id="message-buttons">
  <button id="emoji-btn" class="btn-secondary">😀</button>
  <label class="btn-secondary">
    📎
    <input type="file" id="message-file" style="display:none">
  </label>
  <button id="send-btn" class="btn-primary">Send</button>
</div>
</div>

<div>
<button id="logout-btn" class="btn-danger">Logout</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<script>
// ---------- FIREBASE CONFIG ----------
const firebaseConfig = {
  apiKey: "AIzaSyBJE5z3a6-_2gxonPCmXLgMhlctBkt-wiE",
  authDomain: "jbchat-1fe10.firebaseapp.com",
  projectId: "jbchat-1fe10",
  storageBucket: "jbchat-1fe10.firebasestorage.app",
  messagingSenderId: "217576491356",
  appId: "1:217576491356:web:d736d11730e83f24ee9999",
  measurementId: "G-TM94MLYNGT"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// --- DOM Elements ---
const authContainer = document.getElementById("auth-container");
const chatContainer = document.getElementById("chat-container");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const avatarUpload = document.getElementById("avatar-upload");
const registerBtn = document.getElementById("register-btn");
const loginBtn = document.getElementById("login-btn");
const logoutBtn = document.getElementById("logout-btn");
const groupsDiv = document.getElementById("groups");
const newGroupInput = document.getElementById("new-group-name");
const chatBox = document.getElementById("chat-box");
const messageInput = document.getElementById("message-input");
const messageFile = document.getElementById("message-file");
const sendBtn = document.getElementById("send-btn");
const emojiBtn = document.getElementById("emoji-btn");
const typingDiv = document.getElementById("typing-indicators");

let currentUser;
let currentGroupId = null;

// ---------- AUTH ----------
registerBtn.onclick = async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  const username = usernameInput.value.trim();
  const avatarFile = avatarUpload.files[0];
  if(!email||!password||!username) return alert("Fill all fields");
  let avatarUrl="";
  if(avatarFile){
    const ref=storage.ref("avatars/"+Date.now()+"_"+avatarFile.name);
    await ref.put(avatarFile);
    avatarUrl=await ref.getDownloadURL();
  }
  auth.createUserWithEmailAndPassword(email,password).then(async cred=>{
    await db.collection("users").doc(cred.user.uid).set({username,avatarUrl,online:true,lastSeen:Date.now()});
  }).catch(err=>alert(err.message));
};

loginBtn.onclick=()=>{ 
  const email=emailInput.value.trim(); 
  const password=passwordInput.value.trim(); 
  auth.signInWithEmailAndPassword(email,password).catch(err=>alert(err.message)); 
};

auth.onAuthStateChanged(async user=>{
  if(user){ 
    currentUser=user; 
    authContainer.classList.add("hidden"); 
    chatContainer.classList.remove("hidden"); 
    await db.collection("users").doc(user.uid).update({online:true}); 
    loadGroups(); 
    window.addEventListener("beforeunload",()=>{ db.collection("users").doc(user.uid).update({online:false,lastSeen:Date.now()}); });
  } else { 
    currentUser=null; 
    authContainer.classList.remove("hidden"); 
    chatContainer.classList.add("hidden"); 
    chatBox.innerHTML=""; groupsDiv.innerHTML=""; 
  }
});

// ---------- GROUPS ----------
document.getElementById("create-group-btn").onclick = async ()=>{
  const name = newGroupInput.value.trim();
  if(!name) return;
  await db.collection("groups").add({name, members:[currentUser.uid]});
  newGroupInput.value = "";
};

function loadGroups(){
  db.collection("groups").onSnapshot(snap=>{
    groupsDiv.innerHTML="";
    snap.forEach(doc=>{
      const data = doc.data();
      const div = document.createElement("div");
      div.textContent = data.name;
      div.classList.add("group-item");
      if(currentGroupId === doc.id) div.classList.add("active");
      div.onclick = ()=>{ selectGroup(doc.id); };
      groupsDiv.appendChild(div);
    });
  });
}

function selectGroup(groupId){
  currentGroupId = groupId;
  Array.from(groupsDiv.children).forEach(d=>d.classList.remove("active"));
  const selected = Array.from(groupsDiv.children).find(d=>d.textContent);
  if(selected) selected.classList.add("active");
  chatBox.innerHTML = "";
  loadMessages();
}

// ---------- MESSAGES ----------
sendBtn.onclick = async ()=>{
  if(!currentUser) return alert("Login first");
  if(!currentGroupId) return alert("Select a group first");

  const text = messageInput.value.trim();
  const file = messageFile.files[0];
  if(!text && !file) return alert("Type a message or select a file");

  let fileUrl = "";
  if(file){
    const ref = storage.ref(`messages/${Date.now()}_${file.name}`);
    await ref.put(file);
    fileUrl = await ref.getDownloadURL();
  }

  const userDoc = await db.collection("users").doc(currentUser.uid).get();
  await db.collection("messages").doc(currentGroupId).collection("msgs").add({
    senderId: currentUser.uid,
    username: userDoc.data().username,
    avatarUrl: userDoc.data().avatarUrl,
    text,
    fileUrl,
    timestamp:Date.now()
  });

  messageInput.value="";
  messageFile.value="";
};

function loadMessages(){
  if(!currentGroupId) return;
  db.collection("messages").doc(currentGroupId).collection("msgs")
    .orderBy("timestamp")
    .onSnapshot(snapshot=>{
      chatBox.innerHTML="";
      snapshot.forEach(doc=>{
        const data = doc.data();
        const p = document.createElement("p");
        p.textContent = `${data.username}: ${data.text || ""}`;
        p.className = (data.senderId === currentUser.uid) ? "self" : "other";
        if(data.fileUrl){
          const a = document.createElement("a");
          a.href = data.fileUrl;
          a.target="_blank";
          a.textContent = "[File]";
          p.appendChild(document.createElement("br"));
          p.appendChild(a);
        }
        chatBox.appendChild(p);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });
}

// ---------- EMOJIS ----------
emojiBtn.onclick = ()=>{ messageInput.value += "😀"; };

// ---------- LOGOUT ----------
logoutBtn.onclick = ()=>{
  if(currentUser) db.collection("users").doc(currentUser.uid).update({online:false,lastSeen:Date.now()});
  auth.signOut();
};
</script>
</body>
</html>
